<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cifra de Palco">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cifra de Palco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: app de uma tela, coluna única (máx. 760px): cabeçalho, área rolável, barra de abas. Palco esconde as abas. */
:root{
  --bg:#10141c; --panel:#191f2c; --line:#283044; --fg:#eaedf3; --muted:#8e97ac;
  --accent:#f2a93b; --accent-ink:#1a1206; --chord:#f5b54d; --danger:#ec6b5e;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f4f5f8; --panel:#ffffff; --line:#dbe0ea; --fg:#141924; --muted:#5a6377;
  --accent:#b8640c; --accent-ink:#ffffff; --chord:#a9520a; --danger:#c43d30; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f4f5f8; --panel:#ffffff; --line:#dbe0ea; --fg:#141924; --muted:#5a6377;
  --accent:#b8640c; --accent-ink:#ffffff; --chord:#a9520a; --danger:#c43d30; color-scheme:light }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#head{display:flex;align-items:center;gap:10px;min-height:60px;padding-block:8px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:0}
.sp{flex:1}
.htitle{flex:1;min-width:0;display:flex;flex-direction:column}
.htitle b{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
#main > *{flex-shrink:0}

.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 45%, transparent);background:transparent}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.wide{width:100%}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:24px;line-height:1;display:grid;place-items:center;flex-shrink:0}

input[type=search],input[type=text],input[type=number],input[type=date],textarea{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
textarea{font-family:var(--f-mono);font-size:14px;line-height:1.6;resize:vertical}
#f-body{white-space:pre;overflow-x:auto;overflow-wrap:normal}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.frow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.frow.two{grid-template-columns:repeat(2,minmax(0,1fr))}
select{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-height:44px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li + li{border-top:1px solid var(--line)}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 2px;background:none;border:0;text-align:left;min-height:56px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:var(--f-mono);font-weight:700;font-size:13px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);color:var(--chord);font-variant-numeric:tabular-nums;white-space:nowrap}
.num{font-family:var(--f-mono);color:var(--muted);font-size:13px;width:1.6em;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:32px 8px}

.note{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.note p{margin:0}
.label{font-family:var(--f-display);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.help{font-size:14px;color:var(--muted)}
.help code{font-family:var(--f-mono);color:var(--chord);font-size:13px}

.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:4px 9px}
.meta b{color:var(--fg);font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.tools{display:flex;flex-wrap:wrap;gap:8px}
.grp{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.grp button{min-width:44px;min-height:42px;padding:0 12px;border:0;background:transparent;font-weight:700}
.grp button + button,.grp .val + button,.grp button + .val{border-left:1px solid var(--line)}
.grp button.on{background:var(--accent);color:var(--accent-ink)}
.grp .val{display:flex;align-items:center;padding:0 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.grp .val b{color:var(--chord);font-family:var(--f-mono);margin-left:5px}

/* Cifra */
.chart{--fs:20px;font-size:var(--fs);line-height:1.25;padding-bottom:40vh}
.chart .ln{display:flex;flex-wrap:wrap;align-items:flex-end;margin-bottom:.35em}
.chart .seg{display:inline-flex;flex-direction:column}
.chart .ch{display:block;min-height:1.2em;font-family:var(--f-mono);font-weight:700;color:var(--chord);font-size:.88em;padding-right:.45em;white-space:pre}
.chart .ly{white-space:pre}
.chart .chords-only{gap:.2em 1.1em}
.chart .chords-only .ch{padding:0;font-size:1em}
.chart .ly-only{margin-bottom:.35em;white-space:pre-wrap}
.chart .sec{font-family:var(--f-display);font-size:.55em;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:1.1em 0 .6em;display:flex;align-items:center;gap:.8em}
.chart .sec::after{content:"";flex:1;height:1px;background:var(--line)}
.chart .gap{height:.6em}

/* Setlist */
.srow{display:flex;align-items:center;gap:8px;padding:8px 0;min-height:52px}
.srow .row-main{cursor:pointer}
.mini{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:16px;flex-shrink:0}
.mini:disabled{opacity:.3}

/* Abas */
#tabs{display:flex;border-top:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:12px;font-weight:700;color:var(--muted);min-height:54px}
#tabs button[aria-current="page"]{color:var(--accent)}
#tabs svg{width:22px;height:22px}

/* Palco */
#stagefoot{display:none;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
#app[data-mode="stage"] #tabs{display:none}
#app[data-mode="stage"] #stagefoot{display:flex}
#stagefoot button{flex:1;min-width:0;min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;justify-content:center;padding:0 12px;text-align:left}
#stagefoot button.next{text-align:right;align-items:flex-end}
#stagefoot small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
#stagefoot span{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#stagefoot button:disabled{opacity:.35}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}

/* Controles segmentados */
.seg-ctl{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg-ctl button{min-height:40px;padding:0 14px;border:0;background:transparent;font-weight:700;font-size:14px;color:var(--muted)}
.seg-ctl button + button{border-left:1px solid var(--line)}
.seg-ctl button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* Momentos */
.moments{display:flex;flex-direction:column;gap:12px;padding-bottom:40vh;font-size:var(--fs)}
.mom{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.mom h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.mline{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{font-family:var(--f-mono);font-weight:700;color:var(--chord);font-size:.95em;line-height:1;padding:.4em .55em;border-radius:7px;background:color-mix(in srgb, var(--chord) 12%, transparent);min-width:1.6em;text-align:center}
.rep{font-family:var(--f-mono);font-size:.7em;color:var(--muted);margin-left:4px}
.src{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px}

/* Editor: inserir partes */
.ins{display:flex;flex-wrap:wrap;gap:6px}
.ins button{min-height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:12px;font-weight:700;letter-spacing:.04em}

/* Busca */
.find-row{display:flex;gap:8px}
.find-row input{flex:1;min-width:0}
.status{color:var(--muted);font-size:15px}
.result-head{display:flex;flex-direction:column;gap:2px}
.result-head b{font-size:20px}
.ext{color:var(--accent);font-weight:700;text-decoration:none}

/* Acorde tocável */
.ch[data-c],.chip[data-c]{cursor:pointer}
.ch[data-c]:active,.chip[data-c]:active{opacity:.6}

/* Tab e anotações */
.tab{font-family:var(--f-mono);font-size:max(12px, calc(var(--fs) * .62));line-height:1.35;margin:.2em 0 .6em;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);overflow-x:auto;white-space:pre;color:var(--fg)}
.memo{font-size:.78em;font-style:italic;color:var(--muted);margin:.1em 0 .5em;padding-left:.7em;border-left:2px solid var(--accent)}
.mom .memo{font-size:.8em;margin:0}
.mom .tab{margin:0}

/* Linha atual no modo tempo */
.chart .ln,.chart .ly-only,.chart .tab,.mline{transition:background .25s;border-radius:6px}
.now{background:color-mix(in srgb, var(--accent) 16%, transparent);box-shadow:-6px 0 0 color-mix(in srgb, var(--accent) 16%, transparent),6px 0 0 color-mix(in srgb, var(--accent) 16%, transparent)}
#main{position:relative}

/* Metrônomo */
.beats{display:flex;align-items:center;gap:5px;padding:0 10px}
.beats i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .06s}
.beats i.on{background:var(--accent)}
.beats i.on.one{background:var(--fg)}
.bpm{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;align-items:center;padding:0 10px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Ajustes recolhíveis */
details.adj{border:1px solid var(--line);border-radius:10px}
details.adj summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:700;font-size:14px;color:var(--muted)}
details.adj summary::-webkit-details-marker{display:none}
details.adj summary::after{content:"▾";transition:transform .2s}
details.adj[open] summary::after{transform:rotate(180deg)}
details.adj .tools{padding:0 10px 10px}
.grp button.on,.tog.on{background:var(--accent);color:var(--accent-ink)}
.tog{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700}

/* Folha de acorde */
#sheet[hidden],#toast[hidden]{display:none!important}
.ch sup,.chip sup{font-size:.62em;line-height:0;vertical-align:.6em;margin-left:.08em}
#sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,14,.55)}
#sheet .panel{width:100%;max-width:520px;background:var(--bg);border-top-left-radius:18px;border-top-right-radius:18px;border:1px solid var(--line);border-bottom:0;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px;max-height:85%;overflow:auto;box-sizing:border-box}
.sheet-top{display:flex;align-items:center;gap:10px}
.sheet-top b{font-family:var(--f-mono);font-size:28px;color:var(--chord);flex:1;min-width:0;overflow-wrap:anywhere}
.sheet-top small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.diagram{display:flex;justify-content:center}
.diagram svg{max-width:100%;height:auto}
.notes{font-size:14px;color:var(--muted);text-align:center}
.notes b{font-family:var(--f-mono);color:var(--fg)}

.sheet-inst{align-self:stretch}
.sheet-inst button{flex:1;padding:0 6px;font-size:13px}
.sync-st{margin:0;font-size:13px;color:var(--muted)}
.sync-dot{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:40%;padding-left:6px}
[data-sync-status][data-state="err"]{color:var(--danger)}
[data-sync-status][data-state="ok"]::before{content:"● ";color:#4caf7a}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:420px){ .btn{padding:0 12px} }
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }
</style>

</head>
<body>
<div id="app">
  <header id="head"></header>
  <main id="main"></main>
  <div id="stagefoot"></div>
  <nav id="tabs" aria-label="Seções">
    <button data-act="tab" data-tab="songs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Músicas</button>
    <button data-act="tab" data-tab="sets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01" stroke-width="3"/></svg>Setlists</button>
    <button data-act="tab" data-tab="backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>Backup</button>
  </nav>
</div>
<div id="toast" hidden></div>
<div id="sheet" hidden data-act="sheet-close"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const KEY = 'cifra-palco-v1';

/* ---------- Dados de exemplo ---------- */
const SEED = {
  prefs: { fs: 20 },
  songs: [
    { id:'ex1', ex:true, title:'Amazing Grace', artist:'Tradicional (domínio público)', key:'G', bpm:72, capo:0, shift:0,
      body:`# Verso 1
[G]Amazing [G7]grace, how [C]sweet the [G]sound
That [G]saved a wretch like [D]me
I [G]once was [G7]lost, but [C]now am [G]found
Was [Em]blind, but [D]now I [G]see

# Verso 2
'Twas [G]grace that [G7]taught my [C]heart to [G]fear
And [G]grace my fears re[D]lieved
How [G]precious [G7]did that [C]grace ap[G]pear
The [Em]hour I [D]first be[G]lieved` },
    { id:'ex2', ex:true, title:'Estrada de Terra', artist:'Exemplo', key:'Am', bpm:96, capo:2, shift:0,
      body:`[Intro]
[Am] [F] [C] [G]

# Verso
[Am]Saio cedo, a poeira [F]sobe no portão
[C]Violão nas costas, [G]pé no chão
[Am]Cada curva tem [F]uma canção
[C]Que eu ainda não [E7]sei de cor

# Refrão
[F]Leva eu, estrada, [G]leva eu
[Em]Onde o som do [Am]palco me esperou
[F]Leva eu, estrada, [G]leva eu
Que a [E7]noite é curta e o show co[Am]meçou` },
    { id:'ex3', ex:true, title:'Blues em Lá', artist:'12 compassos, shuffle', key:'A', bpm:110, capo:0, shift:0,
      body:`# Riff
> guitarra sozinha, depois entra a banda
e|-------------------|
B|-------------------|
G|-------------------|
D|-----2--4--2--4----|
A|--0--0--0--0--0--0-|
E|-------------------|

# Volta
[A7] [D7] [A7] [A7]
[D7] [D7] [A7] [A7]
[E7] [D7] [A7] [E7]

# Final
[E7] [D7] [A7] [E7#9]` }
  ],
  setlists: [ { id:'exs', ex:true, name:'Show de sábado', date:'2026-10-31', songIds:['ex2','ex3','ex1'] } ]
};

function load(){
  try { const r = localStorage.getItem(KEY); if (r){ const d = JSON.parse(r); if (d && Array.isArray(d.songs) && Array.isArray(d.setlists)) { d.prefs = d.prefs || {fs:20}; return d; } } } catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
let data = load();
data.prefs = { fs: 20, view: 'lyrics', notation: 'degrees', simplify: false, click: true, inst: 'violao', ...data.prefs };
data.prefs.notation = 'degrees'; // sempre abre em graus; “Acordes” vale só até fechar o app
function fixKeys(){
  let changed = false;
  data.songs.forEach(s => {
    const nb = (s.body || '').replace(/\[([^\]]*)\]/g, (all, t) => { const n = normChord(t); return isChord(n) && n !== t.trim() ? `[${n}]` : all; });
    if (nb !== s.body){ s.body = nb; changed = true; }
    const nk = normKey(s.key);
    if (nk !== (s.key || '')){ s.key = nk; changed = true; }
    if (s.singerKey){ const ns = normKey(s.singerKey); if (ns !== s.singerKey){ s.singerKey = ns; changed = true; } }
    if (!keyRoot(s.key)){ const d = detectKey(s.body); if (d){ s.key = d; s.keyGuess = true; s.shift = s.singerKey ? keyInterval(d, s.singerKey) : (s.shift || 0); changed = true; } }
  });
  if (changed) save({ stamp:false });
}
const PARTS = ['INTRO','VERSO','PRÉ-REFRÃO','REFRÃO','PÓS-REFRÃO','PONTE','SOLO','INTERLÚDIO','FINAL'];
/* Cada música e setlist ganha a hora da última alteração; o que some vira "excluído" (para a sincronização) */
let snap = new Map();
const itemKey = x => { const { updatedAt, ...rest } = x; return JSON.stringify(rest); };
function takeSnap(){ snap = new Map([...data.songs, ...data.setlists].map(x => [x.id, itemKey(x)])); }
function save(opts = {}){
  if (opts.stamp !== false){
    const now = Date.now(), seen = new Set();
    data.deleted = data.deleted || {};
    for (const x of [...data.songs, ...data.setlists]){
      seen.add(x.id);
      if (snap.get(x.id) !== itemKey(x)) x.updatedAt = now;
    }

/* Linhas especiais: tablatura e anotação */
const isTab = l => (l.match(/-/g) || []).length >= 6 && !/\[/.test(l) && /^[\sA-Ga-g#|:\-0-9hpbrsxtv\/\\~().^*=]+$/.test(l);
const isMemo = l => /^\s*>\s*/.test(l);

/* Agrupa a cifra por partes (VERSO, REFRÃO...) só com a harmonia, tabs e anotações */
function parseSections(body){
  const secs = []; let cur = null;
  const open = name => { cur = { name, items: [] }; secs.push(cur); };
  const ensure = () => { if (!cur) open('Início'); };
  for (const raw of (body || '').split('\n')){
    const line = raw.replace(/\s+$/, ''), tl = line.trim(); let m;
    if (!tl) continue;
    if ((m = /^#\s*(.+)/.exec(tl))){ open(m[1].trim()); continue; }
    if ((m = /^\[([^\]]+)\]$/.exec(tl)) && !isChord(m[1])){ open(m[1].trim()); continue; }
    if (isMemo(tl)){ ensure(); cur.items.push({ memo: tl.replace(/^>\s*/, '') }); continue; }
    if (isTab(line)){
      ensure(); const last = cur.items[cur.items.length - 1];
      if (last && last.tab) last.tab.push(line); else cur.items.push({ tab: [line] });
      continue;
    }
    const chords = []; tl.replace(/\[([^\]]*)\]/g, (_, c) => { if (c.trim()) chords.push(c.trim()); });
    if (!chords.length) continue;
    ensure();
    const last = cur.items[cur.items.length - 1];
    if (last && last.chords && last.chords.join(' ') === chords.join(' ')) last.n++;
    else cur.items.push({ chords, n: 1, sung: !!tl.replace(/\[[^\]]*\]/g, '').trim() });
  }
  return secs.filter(s => s.items.some(it => it.chords || it.tab));
}

}
function renderMoments(body, fmt, shape, bpb){
  const secs = parseSections(body);
  if (!secs.length) return '<p class="empty">Esta música ainda não tem acordes. Toque em “Editar” para adicionar.</p>';
  return secs.map(s => `<section class="mom"><h3>${esc(displayPart(s.name))}</h3>${s.items.map(it => {
    if (it.memo != null) return `<p class="memo">${esc(it.memo)}</p>`;
    if (it.tab) return `<pre class="tab" data-b="${bpb * 2}">${esc(it.tab.join('\n'))}</pre>`;
    return `<div class="mline" data-b="${(it.sung && it.chords.length === 1 ? 2 : it.chords.length) * bpb * it.n}">${it.chords.map(c => chordTag('chip', c, fmt, shape)).join('')}${it.n > 1 ? `<span class="rep">×${it.n}</span>` : ''}</div>`;
  }).join('')}</section>`).join('');
}

/* ---------- Renderização da cifra ---------- */
function renderChart(body, fmt, shape, bpb){
  const words = (text, chord) => {
    let ws = (text.match(/\S*\s*/g) || []).filter(Boolean);
    if (!ws.length) ws = [''];
    return ws.map((w, j) => `<span class="seg">${j === 0 && chord ? chordTag('ch', chord, fmt, shape) : '<b class="ch"></b>'}<span class="ly">${w ? esc(w) : '&nbsp;'}</span></span>`).join('');
  };
  const out = [], lines = (body || '').split('\n');
  const isHead = l => { const t = l.trim(), m = /^\[([^\]]+)\]$/.exec(t); return /^#\s*\S/.test(t) || (m && !isChord(m[1])); };
  const skipHead = new Set();
  lines.forEach((l, i) => {
    if (!isHead(l)) return;
    let has = false;
    for (let j = i + 1; j < lines.length && !isHead(lines[j]); j++){
      if (isTab(lines[j]) || (lines[j].match(/\[([^\]]*)\]/g) || []).some(t => isChord(t.slice(1, -1)))){ has = true; break; }
    }
    if (!has) skipHead.add(i);
  });
  for (let li = 0; li < lines.length; li++){
    if (skipHead.has(li)) continue;
    const line = lines[li].replace(/\s+$/, '');
    let m;
    if (!line.trim()){ out.push('<div class="gap"></div>'); continue; }
    if ((m = /^#\s*(.+)/.exec(line.trim()))){ out.push(`<div class="sec">${esc(displayPart(m[1].trim()))}</div>`); continue; }
    if ((m = /^\[([^\]]+)\]$/.exec(line.trim())) && !isChord(m[1])){ out.push(`<div class="sec">${esc(displayPart(m[1].trim()))}</div>`); continue; }
    if (isMemo(line)){ out.push(`<div class="memo">${esc(line.trim().replace(/^>\s*/, ''))}</div>`); continue; }
    if (isTab(line)){
      const block = [line];
      while (li + 1 < lines.length && isTab(lines[li + 1].replace(/\s+$/, ''))) block.push(lines[++li].replace(/\s+$/, ''));
      out.push(`<pre class="tab" data-b="${bpb * 2}">${esc(block.join('\n'))}</pre>`);
      continue;
    }
    const parts = line.split(/\[([^\]]*)\]/);
    if (parts.length === 1){ out.push(`<div class="ly-only" data-b="${bpb}">${esc(line)}</div>`); continue; }
    const chords = parts.filter((_, i) => i % 2).filter(c => c.trim());
    const lyr = parts.filter((_, i) => i % 2 === 0).join('');
    if (!lyr.trim()){
      out.push(`<div class="ln chords-only" data-b="${Math.max(1, chords.length) * bpb}">` + chords.map(c => chordTag('ch', c, fmt, shape)).join('') + '</div>');
      continue;
    }
    let html = parts[0] ? words(parts[0], '') : '';
    for (let i = 1; i < parts.length; i += 2) html += words(parts[i + 1] || '', parts[i].trim());
    out.push(`<div class="ln" data-b="${(chords.length <= 1 ? 2 : chords.length) * bpb}">${html}</div>`);
  }
  return out.join('');
}

  (body || '').replace(/\[([^\]]*)\]/g, (_, c) => { const m = CHORD_RE.exec(c.trim()); if (m) chords.push({ r: IDX[m[1]], min: /^(m(?!aj)|°|º|dim|ø)/.test(m[2]), dim: /^(°|º|dim|ø)|m7?\(?b5/.test(m[2]) }); return ''; });
  if (!chords.length) return '';
  const MAJ = { 0:'M', 2:'m', 4:'m', 5:'M', 7:'M', 9:'m', 11:'d' };
  const MIN = { 0:'m', 2:'d', 3:'M', 5:'m', 7:'Mm', 8:'M', 10:'M' };
  let best = null;
  for (let t = 0; t < 12; t++) for (const minor of [false, true]){
    const scale = minor ? MIN : MAJ;
    let sc = 0;
    chords.forEach((c, i) => {
      const deg = (c.r - t + 12) % 12, want = scale[deg];
      const q = c.dim ? 'd' : c.min ? 'm' : 'M';
      if (want == null) sc -= 1.2;
      else if (want.includes(q)) sc += 2; else sc += 0.3;
      if (deg === 0 && (minor ? c.min : !c.min)) sc += 1;
    });
    const tonic = c => c.r === t && (minor ? c.min : !c.min);
    if (tonic(chords[0])) sc += 3;
    if (tonic(chords[chords.length - 1])) sc += 3;
    if (!best || sc > best.sc) best = { sc, t, minor };
  }
  const flat = best.minor ? [0,2,3,5,7,10].includes(best.t) : [1,3,5,8,10].includes(best.t);
  return (flat ? FL : SH)[best.t] + (best.minor ? 'm' : '');
}

/* ---------- Detectar partes automaticamente ---------- */
const hasSections = body => (body || '').split('\n').some(l => /^\s*#\s*\S/.test(l) || ((m => m && !isTok(m[1]))(/^\s*\[([^\]]+)\]\s*$/.exec(l))));
/* Nome padrão de uma parte (sem número). null = nome genérico ("Primeira Parte"), o app identifica; undefined = nome próprio, mantém */
function partType(label){
  const t = (label || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim();
  if (/^PRE ?(REFRAO|CHORUS)?\b/.test(t)) return 'PRÉ-REFRÃO';
  if (/^POS ?(REFRAO|CHORUS)\b/.test(t)) return 'PÓS-REFRÃO';
  if (/^(REFRAO|CHORUS|CORO)\b/.test(t)) return 'REFRÃO';
  if (/^(INTRO|INTRODUCAO)\b/.test(t)) return 'INTRO';
  if (/^(SOLO|SOLINHO)\b/.test(t)) return 'SOLO';
  if (/^(INTERLUDIO|INTERLUDE|PASSAGEM)\b/.test(t)) return 'INTERLÚDIO';
  if (/^(PONTE|BRIDGE)\b/.test(t)) return 'PONTE';
  if (/^(FINAL|OUTRO|FIM|CODA|ENCERRAMENTO)\b/.test(t)) return 'FINAL';
  if (/^(VERSO|ESTROFE|VERSE)\b/.test(t)) return 'VERSO';
  if (/\bPARTE\b|^INICIO$/.test(t)) return null;
  return undefined;
}
const displayPart = n => partType(n) || n;

/* Identifica as partes: VERSO, PRÉ-REFRÃO, REFRÃO, PÓS-REFRÃO, PONTE, SOLO, INTERLÚDIO, INTRO, FINAL (sem numerar).
   Partes já nomeadas são mantidas; blocos sem acordes não viram parte. */
function nameParts(body){
  const lines = (body || '').replace(/\r/g, '').split('\n');
  const isHead = l => { const t = l.trim(), m = /^\[([^\]]+)\]$/.exec(t); return /^#\s*\S/.test(t) || (m && !isTok(m[1])); };
  const headName = l => l.trim().replace(/^#\s*/, '').replace(/^\[|\]$/g, '').trim();
  const blocks = []; let cur = null;
  for (const l of lines){
    if (!l.trim()){ cur = null; continue; }
    if (isHead(l) || !cur){ cur = { lines: [] }; blocks.push(cur); }
    cur.lines.push(l);
  }
  if (!blocks.length) return body;
  blocks.forEach(b => {
    if (isHead(b.lines[0])){
      const raw = headName(b.lines[0]), t = partType(raw);
      b.lines.shift();
      if (t === null) b.generic = true; else b.fixed = t || raw;
    }
    const lyr = []; let chords = [], chordLines = 0;
    b.lines.forEach(l => {
      if (isMemo(l)) return;
      if (isTab(l)){ b.tab = true; return; }
      const cs = (l.match(/\[([^\]]*)\]/g) || []).map(x => x.slice(1, -1).trim()).filter(isTok);
      if (cs.length){ chords.push(...cs); chordLines++; }
      const tx = l.replace(/\[[^\]]*\]/g, '').trim();
      if (tx) lyr.push(tx.toLowerCase().replace(/[^\p{L}\p{N} ]/gu, ''));
    });
    b.instr = !lyr.length; b.noChords = !chords.length && !b.tab;
    b.csig = chords.join(' '); b.nLines = chordLines;
    b.lsig = lyr.join(' ').replace(/\s+/g, ' ').slice(0, 60);
  });
  // refrão: o que o site chamou de refrão; senão, a letra que mais se repete (contando repetições sem acordes)
  const chorusSigs = new Set(blocks.filter(b => b.fixed === 'REFRÃO' && b.lsig).map(b => b.lsig));
  const cnt = {}; blocks.forEach(b => { if (!b.instr && b.lsig) cnt[b.lsig] = (cnt[b.lsig] || 0) + 1; });
  if (!chorusSigs.size){
    let best = 1, sig = null;
    for (const [k, n] of Object.entries(cnt)) if (n > best){ best = n; sig = k; }
    if (sig) chorusSigs.add(sig);
  }
  const isCh = b => b && (b.fixed === 'REFRÃO' || (!b.instr && b.lsig && chorusSigs.has(b.lsig)));
  // trecho que vem sempre logo depois de um refrão
  const alwaysAfterChorus = sig => blocks.every((b, i) => b.lsig !== sig || b.instr || isCh(blocks[i - 1]));
  const ctx = blocks.filter(b => !b.noChords);
  const verseSigs = new Set(); let chorusSeen = 0;
  ctx.forEach((b, i) => {
    const prev = ctx[i - 1], next = ctx[i + 1];
    let t;
    if (b.fixed) t = b.fixed;
    else if (isCh(b)) t = 'REFRÃO';
    else if (b.instr){
      if (i === 0) t = 'INTRO';
      else if (i === ctx.length - 1) t = 'FINAL';
      else t = b.tab || b.nLines >= 2 ? 'SOLO' : 'INTERLÚDIO';
    } else {
      const repeated = (cnt[b.lsig] || 0) >= 2;
      if (isCh(prev) && repeated && alwaysAfterChorus(b.lsig)) t = 'PÓS-REFRÃO';
      else if (isCh(next) && prev && prev.type === 'VERSO' && b.csig !== prev.csig && !verseSigs.has(b.csig)) t = 'PRÉ-REFRÃO';
      else if (chorusSeen >= 2 && !repeated && !verseSigs.has(b.csig)) t = 'PONTE';
      else if (isCh(prev) && isCh(next) && chorusSeen >= 1 && verseSigs.size && !repeated && !verseSigs.has(b.csig)) t = 'PONTE';
      else t = 'VERSO';
    }
    b.type = t;
    if (t === 'VERSO') verseSigs.add(b.csig);
    if (t === 'REFRÃO') chorusSeen++;
  });
  // monta: cabeçalho em cada parte; um bloco sem nome próprio que continua a parte nomeada pelo site não repete o nome
  let lastType = null, lastFixed = false;
  return blocks.map(b => {
    const body = b.lines.join('\n');
    if (b.noChords && !b.fixed) return body;
    const t = b.type || b.fixed;
    if (!t) return body;
    const join = !b.fixed && !b.generic && lastFixed && t === lastType;
    lastType = t; lastFixed = !!b.fixed || (join && lastFixed);
    return join ? body : `# ${t}\n${body}`;
  }).filter(x => x.trim()).join('\n\n');
}

/* ---------- Converter cifra colada de um site (acordes em cima da letra) ---------- */
/* Tira parênteses de agrupamento: "(G", "D)", "(Am)" -> G, D, Am; mantém os do próprio acorde: E7(9) */
function bareChord(t){
  let x = t;
  while (x.startsWith('(')) x = x.slice(1);
  const bal = () => (x.match(/\(/g) || []).length - (x.match(/\)/g) || []).length;
  while (x.endsWith(')') && bal() < 0) x = x.slice(0, -1);
  return x;
}
/* Graus como texto no editor: o primeiro número é o grau (57 = 5 com sétima, 6m7, b7, 5/7) */
const DEG_RE = /^([#b]?[1-7])((?:maj|dim|aug|sus|add|m|M|[0-9#b+\-°ºøΔ(),])*)(?:\/([#b]?[1-7]))?$/;
const isDegree = t => DEG_RE.test(t.trim());
let TOKEN_MODE = 'chord';
const isTok = t => TOKEN_MODE === 'degree' ? (isDegree(t) || isChord(t)) : isChord(t);
const DEG_SEMI = { '1':0, '#1':1, 'b2':1, '2':2, '#2':3, 'b3':3, '3':4, '4':5, '#4':6, 'b5':6, '5':7, '#5':8, 'b6':8, '6':9, '#6':10, 'b7':10, '7':11 };
function degreeText(c, key){
  const kr = keyRoot(key), m = CHORD_RE.exec(c.trim()); if (!kr || !m) return c;
  const d = n => DEG[(IDX[n] - kr.i + 12) % 12];
  return d(m[1]) + m[2] + (m[3] ? '/' + d(m[3]) : '');
}
function fromDegree(t, key){
  const kr = keyRoot(key), m = DEG_RE.exec(t.trim()); if (!kr || !m) return t;
  const note = dg => { const semi = DEG_SEMI[dg]; if (semi == null) return null;
    const flat = dg.startsWith('b') ? true : dg.startsWith('#') ? false : useFlat(key, 12);
    return (flat ? FL : SH)[(kr.i + semi) % 12]; };
  const r = note(m[1]); if (!r) return t;
  const b = m[3] ? note(m[3]) : null;
  return r + m[2] + (b ? '/' + b : '');
}
/* Troca cada [token] do formato interno usando fn */
const mapTokens = (body, test, fn) => (body || '').replace(/\[([^\]]*)\]/g, (all, t) => test(t.trim()) && t.trim() ? `[${fn(t.trim())}]` : all);
function isChordLine(line){
  const toks = line.trim().split(/\s+/).filter(Boolean);
  if (!toks.length) return false;
  const chords = toks.filter(t => isTok(bareChord(t)));
  const fillers = toks.filter(t => !isTok(bareChord(t)) && /^[(\[]*([|%:\/.\-()]+|x\d+|\d+x|\d+\s*vezes)?[)\]]*$/i.test(t) && !/^\[[^\]]+\]$/.test(t));
  return chords.length > 0 && chords.length + fillers.length === toks.length;
}
function chordsOnly(line){ return line.trim().split(/\s+/).map(bareChord).filter(isTok).map(c => `[${isChord(c) ? normChord(c) : c}]`).join(' '); }
function mergeLine(chordLine, lyric){
  const pos = []; chordLine.replace(/\S+/g, (t, i) => { const c = bareChord(t); if (isTok(c)) pos.push([i, isChord(c) ? normChord(c) : c]); return t; });
  let out = lyric;
  for (let k = pos.length - 1; k >= 0; k--){
    const [i, c] = pos[k];
    if (out.length < i) out = out.padEnd(i);
    out = out.slice(0, i) + `[${c}]` + out.slice(i);
  }
  return out.replace(/\s+$/, '');
}
function looksLikeAbove(text){
  if (/\[[A-G][#b]?[^\]\s]*\][^\n]*[a-zà-ú]/i.test(text) && !text.split('\n').some(isChordLine)) return false;
  return text.split('\n').filter(isChordLine).length >= 2;
}
/* Remove caracteres invisíveis que sites de cifra inserem (U+200B etc.) e troca espaço não separável por espaço */
const cleanText = t => (t || '').replace(/[​-‍⁠﻿­]/g, '').replace(/[   ]/g, ' ').replace(/\r\n?/g, '\n');
function convertPasted(text, opts = {}){
  text = cleanText(text).replace(/\[\(([^\]]+?)\)\]/g, (all, c) => isTok(c) ? `[${c}]` : all);
  const lines = cleanText(text).replace(/\t/g, '    ').split('\n');
  const out = []; let key = '', capo = 0;
  for (let i = 0; i < lines.length; i++){
    const line = lines[i].replace(/\s+$/, ''), tl = line.trim(); let m;
    if (!tl){ if (out.length && out[out.length - 1] !== '') out.push(''); continue; }
    if ((m = /^tom:?\s*([A-G][#b]?m?)\b/i.exec(tl))){ key = key || m[1][0].toUpperCase() + m[1].slice(1); continue; }
    if (/^tom:?$/i.test(tl) && lines[i + 1] && /^\s*[A-G][#b]?m?\s*$/.test(lines[i + 1])){ key = key || normKey(lines[i + 1]); i++; continue; }
    if ((m = /^capotraste\s*(?:na)?\s*(\d+)/i.exec(tl))){ capo = +m[1]; continue; }
    if ((m = /^\[([^\]]+)\]\s*(.*)$/.exec(tl)) && !isTok(m[1])){
      if (out.length && out[out.length - 1] !== '') out.push('');
      out.push('# ' + m[1].trim().toUpperCase());
      if (m[2] && isChordLine(m[2])) out.push(chordsOnly(m[2]));
      else if (m[2] && isTab(m[2])) out.push(m[2]);
      continue;
    }
    if (isTab(line)){ out.push(line); continue; }
    if (isChordLine(line)){
      const next = lines[i + 1] != null ? lines[i + 1].replace(/\s+$/, '') : '';
      if (next.trim() && !isChordLine(next) && !isTab(next) && !isMemo(next) && !/^\[[^\]]+\]/.test(next.trim())){ out.push(mergeLine(line, next)); i++; }
      else out.push(chordsOnly(line));
      continue;
    }
    out.push(line);
  }
  while (out.length && out[out.length - 1] === '') out.pop();
  let res = out.join('\n'), auto = false;
  if (opts.auto !== false){ auto = !hasSections(res); res = nameParts(res); }
  return { body: res, key, capo, auto };
}

/* Texto do editor na notação escolhida */
function editorText(body, mode, key){
  if (mode === 'degree' && keyRoot(key)){ TOKEN_MODE = 'degree'; return toAbove(mapTokens(body, isChord, c => degreeText(c, key))); }
  TOKEN_MODE = 'chord'; return toAbove(body);
}
/* Lê o texto do editor e devolve o formato interno, sempre em acordes */
function readEditor(text, mode, key, opts){
  TOKEN_MODE = mode === 'degree' ? 'degree' : 'chord';
  const r = convertPasted(text, opts);
  if (mode === 'degree') r.body = mapTokens(r.body, isDegree, t => fromDegree(t, key));
  return r;
}

/* Formato interno -> “acordes em cima da letra”, como nos sites e revistas */
function toAbove(body){
  const out = [];
  for (const raw of (body || '').split('\n')){
    const line = raw.replace(/\s+$/, ''), tl = line.trim(); let m;
    if ((m = /^#\s*(.+)/.exec(tl))){ out.push(`[${m[1].trim()}]`); continue; }
    if (!/\[[^\]]*\]/.test(line) || isTab(line) || isMemo(line)){ out.push(line); continue; }
    if ((m = /^\[([^\]]+)\]$/.exec(tl)) && !isTok(m[1])){ out.push(line); continue; }
    const parts = line.split(/\[([^\]]*)\]/);
    const lyricAll = parts.filter((_, i) => i % 2 === 0).join('');
    if (!lyricAll.trim()){ out.push(parts.filter((_, i) => i % 2).map(c => c.trim()).filter(Boolean).join('  ')); continue; }
    let lyric = '', chords = '';
    parts.forEach((p, i) => {
      if (i % 2 === 0){ lyric += p; return; }
      const c = p.trim(); if (!c) return;
      let col = lyric.length;
      if (chords.length && col < chords.length + 1) col = chords.length + 1;
      chords = chords.padEnd(col) + c;
    });
    out.push(chords, lyric.replace(/\s+$/, ''));
  }
  return out.join('\n');
}

/* ---------- Rolagem automática ---------- */
let raf = 0, last = 0, acc = 0;
function step(t){
  const main = $('#main');
  const dt = last ? Math.min(t - last, 64) : 16; last = t;
  acc += ui.speed * 0.018 * dt;
  if (acc >= 1){ const px = Math.floor(acc); acc -= px; main.scrollTop += px; }
  if (main.scrollTop + main.clientHeight >= main.scrollHeight - 2){ stopScroll(); render({keep:true}); return; }
  raf = requestAnimationFrame(step);
}
function startScroll(){ stopTempo(); ui.scroll = true; last = 0; acc = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(step); }
function stopScroll(){ ui.scroll = false; cancelAnimationFrame(raf); }

/* ---------- No tempo: rolagem por compasso + metrônomo ---------- */
const tempo = { on:false, t0:0, bpm:90, bpb:4, countIn:4, lastBeat:-99, els:null, cum:null, raf:0, ac:null };
function collectTempo(){
  const els = [...$('#main').querySelectorAll('[data-b]')].filter(e => +e.dataset.b > 0);
  const cum = [0]; els.forEach(e => cum.push(cum[cum.length - 1] + +e.dataset.b));
  tempo.els = els; tempo.cum = cum;
}
function initAudio(){ try { tempo.ac ??= new (window.AudioContext || window.webkitAudioContext)(); tempo.ac.resume?.(); } catch(e){ tempo.ac = null; } }
function blip(accent){
  const ac = tempo.ac; if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.frequency.value = accent ? 1760 : 1100;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.45, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.09);
  } catch(e){}
}
function pulse(bi){
  const idx = ((bi % tempo.bpb) + tempo.bpb) % tempo.bpb;
  document.querySelectorAll('#beats i').forEach((d, i) => d.classList.toggle('on', i === idx));
  if (data.prefs.click) blip(idx === 0);
}
function startTempo(){
  const s = currentSong(); if (!s) return;
  stopScroll();
  tempo.bpm = +s.bpm || 90; tempo.bpb = +s.bpb || 4; tempo.countIn = tempo.bpb;
  if (!s.bpm) toast('Música sem BPM: usando 90. Ajuste em “Editar”.');
  if (data.prefs.click) initAudio();
  tempo.on = true; tempo.lastBeat = -99; tempo.t0 = performance.now() + 120;
  collectTempo();
  tempo.raf = requestAnimationFrame(tempoStep);
}
function resyncTempo(line){
  collectTempo();
  const i = tempo.els.indexOf(line); if (i < 0) return;
  tempo.t0 = performance.now() - (tempo.cum[i] + tempo.countIn) * 60000 / tempo.bpm;
  tempo.lastBeat = -99;
}
function stopTempo(){
  tempo.on = false; cancelAnimationFrame(tempo.raf);
  document.querySelectorAll('.now').forEach(e => e.classList.remove('now'));
  document.querySelectorAll('#beats i').forEach(d => d.classList.remove('on'));
}
function tempoStep(now){
  if (!tempo.on) return;
  const main = $('#main');
  if (!tempo.els || (tempo.els.length && !tempo.els[0].isConnected)) collectTempo();
  const beatPos = (now - tempo.t0) / 60000 * tempo.bpm - tempo.countIn;
  const bi = Math.floor(beatPos);
  if (bi !== tempo.lastBeat){ tempo.lastBeat = bi; pulse(bi); }
  const { els, cum } = tempo;
  if (beatPos >= 0 && els.length){
    if (beatPos >= cum[cum.length - 1]){ stopTempo(); render({keep:true}); return; }
    let i = 0; while (i < els.length - 1 && cum[i + 1] <= beatPos) i++;
    const el = els[i], frac = (beatPos - cum[i]) / (cum[i + 1] - cum[i]);
    if (!el.classList.contains('now')){ main.querySelectorAll('.now').forEach(e => e.classList.remove('now')); el.classList.add('now'); }
    const target = el.offsetTop + frac * el.offsetHeight - main.clientHeight * 0.32;
    main.scrollTop += (target - main.scrollTop) * 0.08;
  }
  tempo.raf = requestAnimationFrame(tempoStep);
}

/* ---------- Folha do acorde ---------- */
function renderSheet(){
  const c = ui.sheetChord, instKey = INSTR[data.prefs.inst] ? data.prefs.inst : 'violao', inst = INSTR[instKey];
  const s = currentSong(), capo = s ? +s.capo || 0 : 0;
  const flat = /^[A-G]b/.test(c);
  let diag;
  if (instKey === 'teclado') diag = keyboardSVG(c);
  else { const v = findVoicing(c, inst); diag = v ? diagramSVG(v, inst) : '<p class="empty">Não encontrei uma posição confortável para este acorde.</p>'; }
  const notes = chordNotes(c, flat);
  $('#sheet').innerHTML = `<div class="panel" data-act="noop" role="dialog" aria-label="Acorde ${esc(c)}">
    <div class="sheet-top"><b>${esc(c)}${capo && instKey !== 'teclado' ? `<small>forma com capo na ${capo}ª casa</small>` : ''}</b><button class="icon-btn" data-act="sheet-close" aria-label="Fechar">✕</button></div>
    <div class="seg-ctl sheet-inst" role="group" aria-label="Instrumento">${Object.entries(INSTR).map(([k, i]) => `<button data-act="inst" data-v="${k}" aria-pressed="${k === instKey}">${i.name}</button>`).join('')}</div>
    <div class="diagram">${diag}</div>
    <p class="notes">${notes.length ? `Notas: <b>${notes.join(' · ')}</b>` : 'Não reconheci esse acorde.'}</p>
  </div>`;
}
function insertAtCursor(txt, ownLine = true){
  const ta = $('#f-body'); if (!ta) return;
  const pos = ta.selectionStart ?? ta.value.length, before = ta.value.slice(0, pos), after = ta.value.slice(pos);
  const pre = ownLine && before && !before.endsWith('\n') ? '\n' : '';
  ta.value = before + pre + txt + after; ta.focus();
  const c = pos + pre.length + txt.length; ta.setSelectionRange(c, c);
}

/* Editor: converte para graus sozinho (ao colar ou ao sair do campo) */
function autoDegrees(silent){
  const st = curScreen(); if (!st || st.type !== 'edit') return;
  const ta = $('#f-body'), kf = $('#f-key'); if (!ta || !ta.value.trim()) return;
  let key = normKey(kf.value);
  const r = readEditor(ta.value, st.mode, key, { auto:false });
  const hasChord = (r.body.match(/\[([^\]]*)\]/g) || []).some(t => isChord(t.slice(1, -1)));
  if (!hasChord) return;
  if (!keyRoot(key)) key = normKey(r.key) || detectKey(r.body);
  if (!keyRoot(key)) return;
  if (!kf.value.trim() || !keyRoot(normKey(kf.value))) kf.value = key;
  const pos = ta.selectionStart;
  ta.value = editorText(r.body, 'degree', key);
  st.mode = 'degree';
  document.querySelectorAll('[data-act=edit-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === 'degree'));
  if (!silent) toast(`Convertido para graus · tom ${key}`);
  if (document.activeElement === ta && pos != null) ta.setSelectionRange(Math.min(pos, ta.value.length), Math.min(pos, ta.value.length));
}
document.addEventListener('focusout', e => { if (e.target.id === 'f-body') autoDegrees(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden){ $('#sheet').hidden = true; return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  const st = curScreen(), main = $('#main');
  if (st.type !== 'stage' && st.type !== 'song') return;
  if (['PageDown','ArrowDown',' '].includes(e.key)){ e.preventDefault(); main.scrollBy({ top: main.clientHeight * 0.6, behavior:'smooth' }); }
  if (['PageUp','ArrowUp'].includes(e.key)){ e.preventDefault(); main.scrollBy({ top: -main.clientHeight * 0.6, behavior:'smooth' }); }
  if (st.type === 'stage'){
    const n = getSet(st.setId).songIds.filter(getSong).length;
    if (e.key === 'ArrowRight' && st.i < n - 1){ st.i++; render(); }
    if (e.key === 'ArrowLeft' && st.i > 0){ st.i--; render(); }
  }
});

/* ---------- Sincronização entre aparelhos (GitHub, repositório privado) ---------- */
const SYNC_KEY = 'cifra-palco-sync';
const CAN_SYNC = !/claudeusercontent\.com$/.test(location.hostname) && location.protocol.startsWith('http');
let syncCfg = {}; try { syncCfg = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}') || {}; } catch(e){}
const saveSyncCfg = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); } catch(e){} };
const sync = { busy:false, again:false, timer:0, state:'', msg:'' };
const syncOn = () => CAN_SYNC && syncCfg.repo && syncCfg.token;
const b64enc = str => { const b = new TextEncoder().encode(str); let out = ''; for (let i = 0; i < b.length; i += 0x8000) out += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(out); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
async function gh(path, init = {}){
  const res = await fetch('https://api.github.com/repos/' + syncCfg.repo + path, { cache:'no-store', ...init,
    headers: { 'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + syncCfg.token, 'X-GitHub-Api-Version':'2022-11-28', ...(init.body ? { 'Content-Type':'application/json' } : {}) } });
  return res;
}
function mergeData(a, b){
  const del = { ...(a.deleted || {}) };
  for (const [k, t] of Object.entries(b.deleted || {})) del[k] = Math.max(del[k] || 0, t);
  const pick = (xs = [], ys = []) => {
    const m = new Map();
    for (const x of [...xs, ...ys]){ const c = m.get(x.id); if (!c || (x.updatedAt || 0) > (c.updatedAt || 0)) m.set(x.id, x); }
    return [...m.values()].filter(x => !(del[x.id] && del[x.id] >= (x.updatedAt || 0)));
  };
  return { songs: pick(a.songs, b.songs), setlists: pick(a.setlists, b.setlists), deleted: del };
}
const canon = d => JSON.stringify({ songs:[...(d.songs || [])].sort((x, y) => x.id < y.id ? -1 : 1), setlists:[...(d.setlists || [])].sort((x, y) => x.id < y.id ? -1 : 1), deleted:Object.fromEntries(Object.entries(d.deleted || {}).sort()) });
function setSync(state, msg){
  sync.state = state; sync.msg = msg;
  document.querySelectorAll('[data-sync-status]').forEach(el => { el.textContent = msg; el.dataset.state = state; });
}
function syncLabel(){
  if (!syncOn()) return '';
  if (sync.msg) return sync.msg;
  return syncCfg.last ? 'Sincronizado às ' + new Date(syncCfg.last).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) : 'Aguardando sincronizar';
}
function queueSync(delay = 2000){ if (!syncOn()) return; clearTimeout(sync.timer); sync.timer = setTimeout(syncNow, delay); }
async function syncNow(){
  if (!syncOn()) return;
  if (!navigator.onLine){ setSync('off', 'Sem internet · envia quando conectar'); return; }
  if (sync.busy){ sync.again = true; return; }
  sync.busy = true; setSync('busy', 'Sincronizando…');
  try {
    for (let attempt = 0; attempt < 3; attempt++){
      const r = await gh('/contents/dados.json');
      let remote = {}, sha = null;
      if (r.status === 200){ const j = await r.json(); sha = j.sha; try { remote = JSON.parse(b64dec(j.content || '')); } catch(e){ remote = {}; } }
      else if (r.status !== 404) throw { status: r.status };
      const merged = mergeData(data, remote);
      const before = canon(data);
      if (canon(merged) !== before){
        data.songs = merged.songs; data.setlists = merged.setlists; data.deleted = merged.deleted;
        save({ stamp:false });
        const scr = curScreen();
        if (scr && scr.type !== 'edit' && !tempo.on) render({ keep:true });
      }
      if (canon(remote) === canon(merged)) break;
      const body = JSON.stringify({ message: 'Sincroniza músicas', content: b64enc(JSON.stringify({ app:'cifra-palco', songs:merged.songs, setlists:merged.setlists, deleted:merged.deleted }, null, 1)), ...(sha ? { sha } : {}) });
      const w = await gh('/contents/dados.json', { method:'PUT', body });
      if (w.status === 200 || w.status === 201) break;
      if (w.status === 409 || w.status === 422) continue; // outro aparelho salvou junto: busca de novo e junta
      throw { status: w.status };
    }
    syncCfg.last = Date.now(); saveSyncCfg(); sync.msg = ''; setSync('ok', syncLabel());
  } catch(e){
    const st = e && e.status;
    const msg = st === 401 ? 'A chave de acesso não vale mais. Crie outra e conecte de novo.'
      : st === 403 ? 'A chave não tem permissão para gravar nesse repositório.'
      : st === 404 ? 'Repositório não encontrado. Confira o nome e a chave.'
      : !navigator.onLine ? 'Sem internet · envia quando conectar'
      : 'Não deu para sincronizar agora. Tento de novo em instantes.';
    setSync('err', msg);
  } finally {
    sync.busy = false;
    if (sync.again){ sync.again = false; queueSync(300); }
  }
}
window.addEventListener('online', () => queueSync(300));
window.addEventListener('offline', () => syncOn() && setSync('off', 'Sem internet · envia quando conectar'));
let lastVis = 0;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastVis > 15000){ lastVis = Date.now(); queueSync(200); } });
setInterval(() => { if (document.visibilityState === 'visible') queueSync(0); }, 60000);

takeSnap();
fixKeys();
render();
queueSync(500);
</script>

<script>
/* Funciona sem internet: o service worker guarda o app no aparelho na primeira visita */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
